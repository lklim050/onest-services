<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="100%" height="100%">
  <defs>
    <!-- Purple to Blue Gradient -->
    <linearGradient id="onest-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6366F1" />
      <stop offset="50%" stop-color="#4F46E5" />
      <stop offset="100%" stop-color="#2563EB" />
    </linearGradient>

    <!-- Subtle Outer Glow -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#4F46E5" flood-opacity="0.3" />
    </filter>
  </defs>

  <!-- Outer Rounded Container with Subtle Glow -->
  <rect width="64" height="64" rx="16" fill="url(#onest-grad)" filter="url(#glow)" />

  <!-- Letter 'O' Ring (Outer & Inner Cutout) -->
  <path d="M 32 12 C 20.954 12 12 20.954 12 32 C 12 43.046 20.954 52 32 52 C 43.046 52 52 43.046 52 32 C 52 20.954 43.046 12 32 12 Z M 32 20 C 38.627 20 44 25.373 44 32 C 44 38.627 38.627 44 32 44 C 25.373 44 20 38.627 20 32 C 20 25.373 25.373 20 32 20 Z" fill="#FFFFFF" />

  <!-- Internal Accent Spark/Dot (Representing "OneST" Precision) -->
  <circle cx="32" cy="32" r="3.5" fill="#A5B4FC" opacity="0.9" />
</svg>